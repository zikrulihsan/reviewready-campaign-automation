version: 2

# Security updates reach this repository through Dependabot security updates,
# which are enabled in the repository settings and are not configured here.
#
# Routine version-bump pull requests are switched off with a limit of 0. This
# is a prototype built for a hiring challenge rather than a maintained library,
# and a queue of stale dependency pull requests would say less about the
# project than a quiet one. Raise the limits below to turn them back on.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
